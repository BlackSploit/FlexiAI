[project]
name = "physiocoach"
version = "0.1.0"
description = "PhysioCoach agent worker: pose, rep engine, Malayalam coach, Vision Agents call flow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Light core set: installs natively on Windows. physiocoach/core imports only these.
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "openai>=2.26,<3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]
# Everything that joins a call. Installed in Docker only (`uv sync --group call`).
call = [
    "vision-agents[getstream,sarvam,ultralytics,redis]==0.6.9",
    "vision-agents-plugins-openai==0.6.9",
    "mediapipe",
    "opencv-python-headless",
    "ultralytics",
    "torch",
    "torchvision",
    "fastapi",
    "uvicorn[standard]",
    "redis>=5",
    "google-cloud-texttospeech",
]
# Local tools, never installed in the production image.
tools = [
    "sounddevice",
    "pyloudnorm",
]

[tool.uv]
default-groups = ["dev"]
# The private custom-event hook (§8.12) depends on getstream 4.x internals.
constraint-dependencies = ["getstream<5"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physiocoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
